# configs/exp_cyl_cexp002_re1781.toml — Cylinder wake baseline Re=1781（train_cylinder.py）
#
# What: CEXP-002 baseline 設定（QR wake K=100 + soft wall BC + 弱 physics + GradNorm 3-task
#       + continuity AL + SOAP/ScheduleFree + physics denorm），改用 Re=1781 資料。判據用 KE。
# Why : 在 #1 folx anisotropic + C1 nu 量綱（u_inf·D/Re, D=30mm）修正後重跑 cylinder baseline
#       Re=1781（對照 cexp002 的 Re=10031；cylinder_re1781.npz 同為 K=100 QR wake）。
#
# 註：optimizer 固定為 schedule_free + soap（train_cylinder.py 預設，非 TOML 可調）；
#     GradNorm 為 3-task [data, ns_u, ns_v] init [1.0, 0.01, 0.01]（trainer 內寫死）；
#     continuity 不進 GradNorm，改由 Augmented Lagrangian 約束（al_rho/al_lambda_clip）。
#     此 config 只列 train_cylinder.py 實際讀取的 key。

case = "cylinder"
cylinder_data_npz = "data/cylinder_re1781.npz"

# physics（弱）：collocation 點數；GradNorm 從 0.01 起調 physics 權重
num_physics_points = 64
gradnorm_freq = 25
gradnorm_ema_momentum = 0.9
use_physics_denormalization = true

# 模型建構值不在這裡設。cylinder pipeline 讀 model_kwargs **零次**——它走
# pi_lnn_jax/pipeline/cylinder/assembly.py 的 CFG 顯式建構（tests/
# test_schema_default_traps.py 的 docstring 也記著這件事）。本檔一度寫著
# `use_rwf = false` / `cfc_input_dependent_tau = false` 並自稱 legacy 鎖定，
# 那兩行從來沒有生效過：實際建構值是 assembly.CFG 的 True/True/0.5。
# 要改 cylinder 的模型規格，改 assembly.CFG，並同步 tests/test_cylinder_assembly.py
# 的 EXPECTED_CFG 與 EXPECTED_N_PARAMS。

# soft wall BC（固定權重，置於 GradNorm 之外）
bc_weight = 0.1
bc_body_weight = 2.0
bc_n = 128

# 時間課程（對齊 CEXP-002）：t_early 強錨初始條件 + time-marching 漸進展開時間窗
t_early_weight = 10.0
t_early_threshold = 0.05
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
# 註：encoder trim 省略（jit 動態長度會頻繁重編譯；PyTorch 註解明說 trim 僅計算節省、非正確性需求）

# optimizer / 訓練長度
learning_rate = 1e-3
iterations = 10000
seed = 42
artifacts_dir = "artifacts/cylinder/a8_ch2_s42"

# ── A8：套用 chapter02 §Optimisation Stack 描述的協定 ──────────────────────
# 對照臂（exp_a8_cur_s*）不設這些鍵，走 build_optimizer 預設 = 本案一直以來實跑的值
# （pf=10, b2=0.95, 常數 LR）。稿子描述的是下面這組，而它從未套用到 cylinder。
lr_warmup_steps = 2000
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
soap_betas = [0.9, 0.999]   # chapter02 §Optimisation Stack；對照臂走預設 0.95/0.95
