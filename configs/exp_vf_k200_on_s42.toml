# 真渦度重跑 campaign（2026-10-07）：由 configs/exp_alpressure_20261002_k200_on_s42.toml 逐字衍生，只換佈點路徑與 artifacts_dir。
# Matched AL pressure campaign; fixed source f3f2cd8.
# AL-off requires TRAIN_FLAGS=--ablate_no_al; all other settings paired.
[train]
# ── 資料（唯一與 exp_245 不同處：K=200 sensors）────────────────────────
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K200_N256_t0-5_si100_les_n256_T50vort.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K200_N256_t0-5_si100_les_n256_T50vort_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# ── 模型架構 (B3 full, 對齊 pi-lnn EXP-245) ──────────────────────────
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_encoder_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

# ── Loss weights ─────────────────────────────────────────────────────
data_loss_weight = 1.0
physics_loss_weight = 1.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05

# ── 訓練設定 ─────────────────────────────────────────────────────────
iterations = 20000
num_physics_points = 1024
num_sensor_query_points = 2000
# K=200 decode cross-attn OOM 解：collocation+sensor-query 切 4 塊累積梯度（峰值 ∝ 1/4）。
# numerically：data/physics mean-loss 精確等價；AL 的 C² 為 per-chunk 近似（over-budget 點專用，論文註明）。
grad_accum_chunks = 4
learning_rate = 1e-3
max_grad_norm = 1.0
checkpoint_period = 500
seed = 42
artifacts_dir = "artifacts/kolmogorov/vf_k200_on_s42"

# ── LR schedule（對齊 pi-lnn EXP-245）─────────────────────────────────
lr_warmup_steps = 2000
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6

# ── GradNorm ─────────────────────────────────────────────────────────
use_gradnorm = true
gradnorm_freq = 1000
gradnorm_min_weight = 0.05
gradnorm_max_weight = 0.0
gradnorm_init_weights = [1.0, 0.057, 0.057]
gradnorm_ema_momentum = 0.9

# ── Augmented Lagrangian ─────────────────────────────────────────────
al_update_freq = 100
soap_betas = [0.9, 0.999]
al_rho = 0.1
al_lambda_clip = 10.0

# legacy 鎖定（model keys；schema 預設已改 use_rwf/cfc_input_dependent_tau=on，此處明示保留舊架構）
use_rwf = false
cfc_input_dependent_tau = false
