# configs/exp_multi_re_train5_crp.toml — Multi-Re + 連續-Re 物理正則
#
# What:
#   = exp_multi_re_train5 + 連續-Re 物理正則（旗標見檔末），其餘設定相同。
#   單一 model 在 5 個 Re 上聯合訓練，測試對未見 Re 的泛用性。
#     train: Re ∈ {1e3, 5e3, 1e4, 5e4, 1e6}（K=100 QR-pivot sensors）
#     test : Re ∈ {3e3, 8e3, 3e4}（held-out，post-train evaluate_multi_re）
#
# Why / 設計依據:
#   - 每步 random sample 一個 Re（ReBatch runtime arg），故 per-step 記憶體 = 單-Re；
#     5 個 sensor_vals 各僅 (T=50, K=100, 2)，可忽略。
#   - decode cross-attention 的 keys = K=100 sensor tokens（與 T 無關），T 只在 encode
#     的 CfC recurrent（線性）出現 → T=50 不是記憶體驅動。
#   - 記憶體旋鈕只有 num_physics_points / num_sensor_query_points（沿用 v3 已驗證可跑值）。
#     OOM fallback 階梯：num_sensor_query_points 2000→1000、num_physics_points 1024→512、
#     time_strides 4→8（T=50→25）。
#
# d0 約束:
#   訓練期 eval 只比對 d0 = datasets[0]（_load_dns_for_eval 用 dns_paths[0]）。
#   故 re_values[0] / sensor_jsons[0] / dns_paths[0] 必須同為 Re=1000 且同一 DNS realization
#   （sweep si64_seed42；sensors 由該 DNS 經 QR-pivot 產生）。held-out test 各 Re 的逐一
#   評估留給 evaluate_multi_re（另寫）。

[train]
# ── 資料（順序即 d0..d4；d0=Re1000 對齊 hard eval）─────────────────────
sensor_jsons = [
  "data/sensors/sensors_qrpivot_K100_Re1000_N128_t0-5.json",
  "data/sensors/sensors_qrpivot_K100_Re5000_N256_t0-5.json",
  "data/sensors/sensors_qrpivot_K100_Re10000_N256_t0-5.json",
  "data/sensors/sensors_qrpivot_K100_Re50000_N640_t0-5.json",
  "data/sensors/sensors_qrpivot_K100_Re1000000_N1280_t0-5.json",
]
re_values = [1000.0, 5000.0, 10000.0, 50000.0, 1000000.0]
# 各 Re 原始 201/200 snapshots → stride 4 → T≈50；loader 截到共同最小 T 對齊
time_strides = [4, 4, 4, 4, 4]
# re_norm = log(Re)/log(1e6) → 訓練集落在 [0.5, 1.0]，FiLM 條件不外推
re_norm_scale = 1000000.0
# 訓練期 eval truth：只 dns_paths[0] 被載入（= d0 = Re=1000 sweep DNS）
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re1000_N128_T5_dt3p91e4_si64_seed42.npy",
]
observed_sensor_channels = ["u", "v"]
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

# ── 模型架構（B3 + vector attention，承襲 exp_re10000_T20_random_v3）───
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_encoder_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 64
output_head_gain = 1.0
operator_rank = 256
domain_length = 1.0
attention_kind = "vector"

# ── Loss weights ─────────────────────────────────────────────────────
data_loss_weight = 1.0
physics_loss_weight = 1.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05

# ── 訓練設定（num_physics_points / num_sensor_query_points = OOM 旋鈕）──
iterations = 20000
num_physics_points = 1024
num_sensor_query_points = 2000
learning_rate = 1e-3
max_grad_norm = 1.0
checkpoint_period = 500
seed = 42
artifacts_dir = "artifacts/kolmogorov/multi_re_train5_crp"

# ── 連續-Re 物理正則（spec 2026-06-13）──────────────────────────────
# 每步額外抽 re_norm'~U[0.5,1]，在 collocation 點以 nu' + 內插 norm_stats 強制 NS 殘差，
# 加權併入物理 task（data loss / AL / causal 仍只在 data-Re）。w=1.0 等權。
use_continuous_re_physics = true
continuous_re_physics_weight = 1.0

# ── LR schedule ──────────────────────────────────────────────────────
lr_warmup_steps = 2000
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6

# ── GradNorm ─────────────────────────────────────────────────────────
use_gradnorm = true
gradnorm_freq = 1000
gradnorm_min_weight = 0.05
gradnorm_max_weight = 0.0
gradnorm_init_weights = [1.0, 0.057, 0.057]
gradnorm_ema_momentum = 0.9

# ── Augmented Lagrangian ─────────────────────────────────────────────
al_rho = 0.1
al_lambda_clip = 10.0
al_update_freq = 100
al_warmup_steps = 5000

# ── SOAP betas ───────────────────────────────────────────────────────
soap_betas = [0.9, 0.999]

# legacy 鎖定（model keys；schema 預設已改 use_rwf/cfc_input_dependent_tau=on，此處明示保留舊架構）
use_rwf = false
cfc_input_dependent_tau = false
