# configs/exp_cyl_cexp002.toml — Cylinder wake CEXP-002 parity（train_cylinder.py）
#
# What: 複現 PyTorch CEXP-002 唯一 working baseline（QR wake K=100 + soft wall BC + 弱 physics
#       + GradNorm 4-task + SOAP/ScheduleFree + physics denorm），判據用 KE（非 field-L2）。
# Why : pi-lnn-jax 的 CEXP-002 起點；failure 對比臂以 --n_collo 1024 覆蓋（GradNorm 放大假說）。
#
# 註：optimizer 固定為 schedule_free + soap（train_cylinder.py 預設，非 TOML 可調）；
#     GradNorm 為 4-task [data, ns_u, ns_v, cont] init [1.0, 0.01, 0.01, 0.01]（trainer 內寫死）。
#     此 config 只列 train_cylinder.py 實際讀取的 key。

case = "cylinder"
cylinder_data_npz = "data/cylinder_v1.npz"

# physics（弱）：collocation 點數；GradNorm 從 0.01 起調 physics 權重
num_physics_points = 64
gradnorm_freq = 25
gradnorm_ema_momentum = 0.9
use_physics_denormalization = true

# soft wall BC（固定權重，置於 GradNorm 之外）
bc_weight = 0.1
bc_body_weight = 2.0
bc_n = 128

# 時間課程（對齊 CEXP-002）：t_early 強錨初始條件 + time-marching 漸進展開時間窗
t_early_weight = 10.0
t_early_threshold = 0.05
time_marching = false
time_marching_start = 0.5
time_marching_warmup = 0.3
# 註：encoder trim 省略（jit 動態長度會頻繁重編譯；PyTorch 註解明說 trim 僅計算節省、非正確性需求）

# optimizer / 訓練長度
learning_rate = 1e-3
iterations = 10000
seed = 42

# 模型建構值不在這裡設。cylinder pipeline 讀 model_kwargs **零次**——它走
# pi_lnn_jax/pipeline/cylinder/assembly.py 的 CFG 顯式建構（tests/
# test_schema_default_traps.py 的 docstring 也記著這件事）。本檔一度寫著
# `use_rwf = false` / `cfc_input_dependent_tau = false` 並自稱 legacy 鎖定，
# 那兩行從來沒有生效過：實際建構值是 assembly.CFG 的 True/True/0.5。
# 要改 cylinder 的模型規格，改 assembly.CFG，並同步 tests/test_cylinder_assembly.py
# 的 EXPECTED_CFG 與 EXPECTED_N_PARAMS。
