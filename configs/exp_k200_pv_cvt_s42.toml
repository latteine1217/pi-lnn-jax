# exp_k200_pv_cvt_s42.toml — K=200 operating-point campaign, wave 2（2026-08-19）
# 自動衍生自 exp_pv_cvt_s42.toml；唯一變更：sensor K100→K200、artifacts_dir、grad_accum_chunks=4。
# 計畫見 knowledge/experiments/k200-operating-point-campaign-2026-08.md
# configs/exp_pv_cvt_s42.toml — placement-variance campaign CVT 臂（派生自 exp_pv_spacefill_s42.toml）
# placement=CVT (Centroidal Voronoi Tessellation, Lloyd, DNS-free, zero flow info), training seed=42（placement 固定）。
# 目的：single-seed scout — 第二個獨立均勻方法(CVT vs FPS)是否也落在 ~4.6% floor（背書 uniformity confounder、
#   反駁 CVT-based learned placement 如 VSOPINN）。單 seed 僅方向性判讀，不宣稱打平 oracle / 勝 LES-QR（σ_training≈0.11-0.18pp）。
# 與 pv_spacefill/pv_les/pv_oracle 同 t0-5/si100/T_total=5 regime，唯一變數= placement（sensor 檔）。

[train]
# ── 資料 ─────────────────────────────────────────────────────────────
# Path 相對本專案 root（大檔走 PILNJAX_DATA_ROOT），
# pi_lnn_jax/data.py:load_sensors_from_path 會自動 prefix。
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_cvt_K200_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_cvt_K200_N256_t0-5_si100_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# ── 模型架構 (B3 full, 對齊 pi-lnn EXP-245) ──────────────────────────
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_encoder_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

# ── Loss weights ─────────────────────────────────────────────────────
data_loss_weight = 1.0
physics_loss_weight = 1.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05

# ── 訓練設定 ─────────────────────────────────────────────────────────
iterations = 20000
num_physics_points = 1024
grad_accum_chunks = 4
num_sensor_query_points = 2000
learning_rate = 1e-3
max_grad_norm = 1.0
checkpoint_period = 500
seed = 42
artifacts_dir = "artifacts/kolmogorov/k200_pv_cvt_s42"

# ── LR schedule（對齊 pi-lnn EXP-245）─────────────────────────────────
lr_warmup_steps = 2000
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6

# ── GradNorm（對齊 pi-lnn freq=1000 + init_weights + ema_momentum）─────
use_gradnorm = true
gradnorm_freq = 1000
gradnorm_min_weight = 0.05

# legacy 鎖定：schema 預設已改 use_rwf/cfc_input_dependent_tau=on；此論文主 baseline 明示
# false 保留舊架構與既有 checkpoint 可重現（維持與 pv 其他臂完全同架構）
use_rwf = false
cfc_input_dependent_tau = false
gradnorm_max_weight = 0.0
gradnorm_init_weights = [1.0, 0.057, 0.057]
gradnorm_ema_momentum = 0.9

# ── Augmented Lagrangian ────────────────────────────────────────────────────
al_update_freq = 100

# ── SOAP betas ─────────────────────────────────────────────────────────────
soap_betas = [0.9, 0.999]

# ── Augmented Lagrangian for continuity ──────────────────────────────
al_rho = 0.1
al_lambda_clip = 10.0
