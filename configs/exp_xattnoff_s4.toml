# 歸因基準臂：cross-attention OFF、mMLP 全關。
# 與 exp_mmlp_full_s* 只差三個 mmlp 旗標，其餘（base、sensor、DNS、iterations、
# attention_kind、seed 對應）完全相同。有了這一格，mmlp_full 的 11.05% 才能拆成
# 「關 cross-attention 的代價」與「完整 mMLP 的貢獻」兩個獨立效應量——否則兩個
# 變因綁在一起，差異無從歸因。
#
# 三個旗標明寫 false 而非吃 schema 預設：預設會變（見 900147d 的 use_rwf），
# 而這一臂的意義完全建立在「與 mmlp_full 只差這三個鍵」上。
# 衍生自 exp_mmlp_full_s1.toml（其 base 為 configs/exp_re10000_T20_les_qr_v3.toml）。

[train]
# ── 資料 ─────────────────────────────────────────────────────────────
sensor_jsons = [
  "data/sensors/re10000/sensors_les_qr_K100_N256_t0-20_si128.json",
]
re_values = [10000.0]
time_strides = [8]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T20_dt1p95e4_si128_seed42.npy",
]
observed_sensor_channels = ["u", "v"]
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

# ── 模型架構（B3 + vector attention, no W_O）──────────────────────────
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_encoder_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 64
output_head_gain = 1.0
operator_rank = 256
domain_length = 1.0
attention_kind = "vector"

# ── Loss weights ─────────────────────────────────────────────────────
data_loss_weight = 1.0
physics_loss_weight = 1.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05

# ── 訓練設定 ─────────────────────────────────────────────────────────
iterations = 20000
num_physics_points = 1024
num_sensor_query_points = 2000
learning_rate = 1e-3
max_grad_norm = 1.0
checkpoint_period = 500
seed = 4
artifacts_dir = "artifacts/kolmogorov/xattnoff_s4"

# ── LR schedule ────────────────────────────────────────────────────────
lr_warmup_steps = 2000
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6

# ── GradNorm ───────────────────────────────────────────────────────────
use_gradnorm = true
gradnorm_freq = 1000
gradnorm_min_weight = 0.05

# legacy 鎖定：schema 預設已改 use_rwf/cfc_input_dependent_tau=on；此 Re=10000 baseline 明示
# false 保留舊 param-tree（且維持 vs exp_re10000_T20_les_qr_v3_rwf 的 RWF A/B 對照）
use_rwf = false
cfc_input_dependent_tau = false
gradnorm_max_weight = 0.0
gradnorm_init_weights = [1.0, 0.057, 0.057]
gradnorm_ema_momentum = 0.9

# ── Augmented Lagrangian ───────────────────────────────────────────────
al_rho = 0.1
al_lambda_clip = 10.0
al_update_freq = 100
al_warmup_steps = 5000

# ── SOAP betas ────────────────────────────────────────────────────────
soap_betas = [0.9, 0.999]

# ── ablation: cross-attention OFF，mMLP 全關（歸因基準）──
use_modified_mlp = false
mmlp_branch_u = false
mmlp_gate_branch = false
disable_cross_attention = true
