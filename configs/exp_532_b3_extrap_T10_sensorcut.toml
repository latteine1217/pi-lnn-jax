# lr_schedule = "soap"                  # 改用 CLI: --optimizer schedule_free
# use_schedule_free = true              # 改用 CLI: --optimizer schedule_free
# soap_betas = [0.9, 0.999]
# soap_precondition_frequency = 2
# (lr_warmup_steps / lr_decay_steps / lr_decay_gamma / min_learning_rate
#  已從 JAX-TODO 移出，現於 [train] 區實裝)
# soap_use_step_decay = true
# (gradnorm_ema_momentum / gradnorm_init_weights 已從 JAX-TODO 移出，現於 [train] 區實裝)
# gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
# al_constraints = ["cont"]
# al_init_lambda = 0.0                  # train_kolmogorov.py:657 寫死 0.0（一致）
# al_update_freq = 100                  # JAX 共用 gradnorm_freq
# al_ema_momentum = 0.5
# al_allow_cont_in_gradnorm = true
# time_marching = true                  # 改用 CLI: --use_time_marching
# time_marching_start = 0.5             # 改用 CLI: --tm_start_frac 0.5
# time_marching_warmup = 0.3            # ≈ pi-lnn 比例制；JAX 用絕對步數
# time_marching_warmup_steps = 2000     # 改用 CLI: --tm_warmup_steps 2000
# use_sensor_physics = false
# device = "cuda"                       # 改用 env JAX_PLATFORMS=cuda
